name: EarlyHardstyle

options:
  bundleIdPrefix: com.erykszczesniak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  EarlyHardstyleKit:
    path: Packages/Modules

targets:
  EarlyHardstyle:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: EarlyHardstyleKit
        product: Core
      - package: EarlyHardstyleKit
        product: Services
      - package: EarlyHardstyleKit
        product: DesignSystem
      - package: EarlyHardstyleKit
        product: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erykszczesniak.EarlyHardstyle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: EarlyHS
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  EarlyHardstyle:
    build:
      targets:
        EarlyHardstyle: all
    run:
      config: Debug
    archive:
      config: Release

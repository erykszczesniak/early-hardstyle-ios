name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftFormat (lint mode)
        run: swiftformat . --lint

      - name: SwiftLint (strict)
        run: swiftlint lint --strict

  build-test:
    name: Build & Test
    # macos-26: the Liquid Glass layer (glassEffect/GlassEffectContainer/
    # tabViewBottomAccessory) needs the iOS 26 SDK — macos-15's Xcode 16
    # cannot even parse those symbols (#available is runtime-only).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; ids=[dev['udid'] for rt in d for dev in d[rt] if dev.get('isAvailable') and 'iPhone' in dev['name']]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project EarlyHardstyle.xcodeproj \
            -scheme EarlyHardstyle \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -quiet

      - name: Test modules
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme EarlyHardstyleKit-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -quiet
        working-directory: Packages/Modules

      # UI smoke tests exercise real touch interaction and caught the scroll
      # regression during development. They are environment-sensitive on the
      # headless CI simulator, so they run here as informational only
      # (continue-on-error) — the reliable gate is the build + module tests
      # above. Run them locally with:
      #   xcodebuild test -scheme EarlyHardstyle -destination '…iPhone…'
      - name: UI smoke tests (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project EarlyHardstyle.xcodeproj \
            -scheme EarlyHardstyle \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -quiet
